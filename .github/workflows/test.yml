name: Tests

# Prueft, dass die Rechenverfahren stimmen und der Build durchlaeuft. Nutzt
# synthetische Testdaten, damit kein Netzzugriff auf die Quelle noetig ist.
#
# Laeuft auch bei einem Push auf main. Wer direkt auf main committet, saehe
# sonst in GitHub nie ein Testergebnis und erfuehre von einem Fehler erst,
# wenn der Netlify-Build abbricht.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/make-fixture.mjs
      - run: npm run fetch:fixture
      - run: npm run build
      - run: npm run check
